services:
  db:
    image: postgis/postgis:16-3.4
    container_name: wfi-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wavedb}
      POSTGRES_USER: ${POSTGRES_USER:-wave}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wave_dev_password}
      # Israel-relevant locale for text sorting
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - wfi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wave} -d ${POSTGRES_DB:-wavedb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wfi-redis
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - wfi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  wfi_db_data:
  wfi_redis_data:
